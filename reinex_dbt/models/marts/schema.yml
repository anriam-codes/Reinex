version: 2

models:
  - name: dim_vendor
    columns:
      - name: vendor_id
        tests:
          - not_null
          - unique

  - name: dim_passenger_count
    columns:
      - name: passenger_count
        tests:
          - not_null
          - unique

  - name: dim_location
    columns:
      - name: location_id
        tests:
          - not_null
          - unique

  - name: dim_time
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: fact_trip
    columns:
      - name: trip_id
        tests:
          - not_null

      - name: fare_amount
        tests:
          - not_null