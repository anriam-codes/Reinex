services:
  postgres-rei:
    image: postgres:16
    container_name: postgres-rei

    environment:
      POSTGRES_USER: rei
      POSTGRES_PASSWORD: rei123
      POSTGRES_DB: reinex

    ports:
      - "5433:5432"

    volumes:
      - postgres_reinex_data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres_reinex_data: